[build-system]
requires = ["poetry-core>=2"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
name = "classes"
version = "0.4.1"
description = "Smart, pythonic, ad-hoc, typed polymorphism for Python"
license = "BSD-2-Clause"

authors = [
  "Nikita Sobolev <mail@sobolevn.me>",
]

readme = "README.md"

repository = "https://github.com/dry-python/classes"
homepage = "https://classes.readthedocs.io"

keywords = [
  "functional programming",
  "fp",
  "type class",
  "typeclass",
  "typeclasses",
  "ad-hoc",
  "composition",
  "type-safety",
  "mypy",
  "stubs"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities"
]

[tool.poetry.dependencies]
python = "^3.11"
typing-extensions = ">=4"

[tool.poetry.group.dev.dependencies]
mypy = ">=1.19,<2.5"

wemake-python-styleguide = "^1.7"
ruff = ">=0.16,<0.18"
safety = "^2.3"

pytest = "^9.1"
pytest-cov = "^7.1"
pytest-randomly = ">=4.1,<6.0"
pytest-mypy-plugins = "^4.0"

[tool.poetry.group.docs.dependencies]
sphinx = "^9.0"
sphinx-autodoc-typehints = "^3.6"
sphinxcontrib-mermaid = "^2.1"
sphinx-typlog-theme = "^0.8"
codespell = "^2.2"
phantom-types = "^1.0"
tomli = "^2.0"

[tool.ruff]
# Ruff config: https://docs.astral.sh/ruff/settings
preview = false
fix = true
output-prefer-rule-codes = true
target-version = "py311"
line-length = 80

[tool.ruff.format]
quote-style = "single"
docstring-code-format = false

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "C90",  # maccabe
  "COM",  # flake8-commas
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle
  "ERA",  # flake8-eradicate
  "EXE",  # flake8-executable
  "F",    # pyflakes
  "FBT",  # flake8-boolean-trap
  "FLY",  # pyflint
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "PERF", # perflint
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff
  "S",    # flake8-bandit
  "SIM",  # flake8-simpify
  "SLF",  # flake8-self
  "SLOT", # flake8-slots
  "T100", # flake8-debugger
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle
  "YTT",  # flake8-2020
]
ignore = [
  "A005",    # allow to shadow stdlib and builtin module names
  "COM812",  # trailing comma, conflicts with `ruff format`
  # Different doc rules that we don't really care about:
  "D100",
  "D104",
  "D106",
  "D203",
  "D212",
  "D401",
  "D404",
  "D405",
  "D421",    # property docstrings can start with a verb
  "ISC001",  # implicit string concat conflicts with `ruff format`
  "ISC003",  # prefer explicit string concat over implicit concat
  "PLR09",   # we have our own complexity rules
  "PLR2004", # do not report magic numbers
  "PLR6301", # do not require classmethod / staticmethod when self not used
  "RUF105",  # keep old `# noqa` comments style, not `# ruff` comments
  "RUF106",  # we prefer old error codes
  "RUF201",  # keep old rule codes instead of verbose names
  "TRY003",  # long exception messages from `tryceratops`
]
external = ["WPS"]

[tool.ruff.lint.per-file-ignores]
# We need `assert`s to please mypy:
"classes/contrib/mypy/**" = ["S101"]
# There are multiple assert's in tests:
"tests/**" = ["S101", "FBT001", "FBT002", "FBT003", "SLF001"]
"classes/__init__.py" = ["F401"]


[tool.codespell]
skip = [
  "*.lock",
  ".mypy_cache",
  "__pycache__",
  "_build",
  "docs/htmlcov",
]